name: Build OpenWrt

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_BRANCH: main

jobs:
  build:
    name: Build OpenWrt
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ============================================================
      # 1. Checkout your config repository
      # ============================================================
      - name: Checkout config
        uses: actions/checkout@v4

      # ============================================================
      # 2. Install build dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            bc \
            libelf-dev \
            liblzma-dev \
            pkg-config \
            subversion \
            time \
            xsltproc \
            zstd \
            python3-pyelftools

      # ============================================================
      # 3. Clone OpenWrt
      # ============================================================
      - name: Clone OpenWrt
        run: |
          git clone \
            --depth=1 \
            --branch "${OPENWRT_BRANCH}" \
            "${OPENWRT_REPO}" \
            openwrt

      # ============================================================
      # 4. Record OpenWrt version
      # ============================================================
      - name: Get OpenWrt version
        id: version
        working-directory: openwrt
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          COMMIT_FULL=$(git rev-parse HEAD)

          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "commit_full=${COMMIT_FULL}" >> "$GITHUB_OUTPUT"

          echo "OpenWrt commit: ${COMMIT_FULL}"

      # ============================================================
      # 5. Install custom feeds
      # ============================================================
      - name: Install feeds configuration
        run: |
          if [ ! -f feeds.conf.default ]; then
            echo "ERROR: feeds.conf.default not found"
            exit 1
          fi

          cp feeds.conf.default openwrt/feeds.conf.default

      # ============================================================
      # 6. Update feeds
      # ============================================================
      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a

      # ============================================================
      # 7. Install feeds
      # ============================================================
      - name: Install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds install -a

      # ============================================================
      # 8. Load configuration
      # ============================================================
      - name: Load OpenWrt config
        run: |
          if [ ! -f config ]; then
            echo "ERROR: config not found"
            exit 1
          fi

          cp config openwrt/.config

      # ============================================================
      # 9. Normalize configuration
      # ============================================================
      - name: Run defconfig
        working-directory: openwrt
        run: |
          make defconfig

      # ============================================================
      # 10. Show important configuration
      # ============================================================
      - name: Show build configuration
        working-directory: openwrt
        run: |
          echo "========================================"
          echo "OpenWrt commit:"
          git rev-parse HEAD
          echo "========================================"

          echo "Target:"
          grep '^CONFIG_TARGET_' .config | grep '=y' || true

          echo "Selected packages:"
          grep '^CONFIG_PACKAGE_.*=y' .config || true

      # ============================================================
      # 11. Download sources
      # ============================================================
      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j"$(nproc)"

      # ============================================================
      # 12. Build
      # ============================================================
      - name: Build OpenWrt
        working-directory: openwrt
        run: |
          echo "CPU cores: $(nproc)"
          echo "Memory:"
          free -h

          make -j"$(nproc)"

      # ============================================================
      # 13. Check firmware
      # ============================================================
      - name: Check firmware
        working-directory: openwrt
        run: |
          echo "Firmware files:"
          find bin/targets -type f -printf '%p\n' | sort

          echo
          echo "Firmware size:"
          du -sh bin/targets

      # ============================================================
      # 14. Prepare release files
      # ============================================================
      - name: Prepare release
        id: release
        working-directory: openwrt
        run: |
          DATE=$(date -u '+%Y.%m.%d')
          COMMIT=$(git rev-parse --short HEAD)

          RELEASE_TAG="openwrt-${DATE}-${COMMIT}"

          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

          mkdir -p ../release

          tar \
            --zstd \
            -cf "../release/${RELEASE_TAG}.tar.zst" \
            bin/targets

          echo "Release file:"
          ls -lh ../release/

      # ============================================================
      # 15. Upload artifact for debugging
      # ============================================================
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ steps.version.outputs.commit }}
          path: openwrt/bin/targets/
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 16. Generate release notes
      # ============================================================
      - name: Generate release notes
        run: |
          cat > release-notes.md <<EOF
          # OpenWrt

          ## Build information

          - OpenWrt branch: \`${OPENWRT_BRANCH}\`
          - OpenWrt commit: \`${{ steps.version.outputs.commit_full }}\`
          - Build date (UTC): \`$(date -u '+%Y-%m-%d %H:%M:%S')\`
          - Runner: \`ubuntu-24.04\`

          ## Configuration

          This firmware was built using the \`config\` and
          \`feeds.conf.default\` files from this repository.

          ## Included components

          - LuCI
          - AdGuardHome
          - Nikki
          - Mihomo Meta
          - IPv4 / IPv6
          - PPPoE
          - TUN
          - TPROXY
          - nftables
          - TCP BBR

          ## Firmware

          The complete firmware output is packaged as:

          \`${{ steps.release.outputs.tag }}.tar.zst\`
          EOF

      # ============================================================
      # 17. Create GitHub Release
      # ============================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: OpenWrt ${{ steps.release.outputs.tag }}
          body_path: release-notes.md
          files: |
            release/${{ steps.release.outputs.tag }}.tar.zst
          fail_on_unmatched_files: true
          generate_release_notes: false
