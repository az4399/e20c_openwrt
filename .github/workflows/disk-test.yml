name: OpenWrt Free Space & Build Test

on:
  workflow_dispatch:

jobs:
  cleanup-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Disk space before cleanup
        run: |
          echo "===== 磁盘清理前状态 ====="
          df -h /
          echo
          echo "===== 根目录一级占用 ====="
          sudo du -xh / --max-depth=1 2>/dev/null | sort -h

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          # 移除 runner 预装工具缓存 (Go, Node, Java, Python 等)
          tool-cache: true
          # 移除 Android SDK & NDK
          android: true
          # 移除 .NET SDK
          dotnet: true
          # 移除 GHC / Haskell
          haskell: true
          # 卸载大型 apt 预装包 (Chrome, Edge, MySQL, PostgreSQL, Powershell等)
          large-packages: true
          # 彻底清除 Docker 镜像与底层数据
          docker-images: true
          # 卸载 Swap 交换分区以收回磁盘空间
          swap: true

      - name: Extra OpenWrt Cleanup
        run: |
          # 清理 jlumbroso 未完全杀干净的残余日志与文档
          sudo journalctl --vacuum-time=1s || true
          sudo rm -rf /usr/share/doc/* /usr/share/man/* /usr/share/info/*
          sudo rm -rf /tmp/* /var/tmp/* /var/log/*
          sync

      - name: Disk space after cleanup
        run: |
          echo "===== 磁盘清理后状态 ====="
          df -h /
          echo
          echo "===== 根目录一级占用 ====="
          sudo du -xh / --max-depth=1 2>/dev/null | sort -h
