name: Runner Extreme Disk Cleanup

on:
  workflow_dispatch:

jobs:
  disk-cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Disk before cleanup
        run: |
          echo "===== BEFORE ====="
          df -h /

          echo
          echo "===== TOP LEVEL ====="
          sudo du -xh / --max-depth=1 2>/dev/null | sort -h

      - name: Extreme cleanup
        run: |
          set -eux

          echo "===== Docker cleanup ====="
          sudo docker system prune -af --volumes || true

          echo "===== APT cleanup ====="
          sudo apt-get clean
          sudo apt-get autoclean
          sudo rm -rf /var/lib/apt/lists/*

          echo "===== Remove Android ====="
          sudo rm -rf /usr/local/lib/android

          echo "===== Remove .NET ====="
          sudo rm -rf /usr/share/dotnet

          echo "===== Remove GHC ====="
          sudo rm -rf /opt/ghc

          echo "===== Remove Haskell ====="
          sudo rm -rf /opt/hostedtoolcache/haskell

          echo "===== Remove Swift ====="
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/swift

          echo "===== Remove Boost ====="
          sudo rm -rf /usr/local/share/boost

          echo "===== Remove Node global modules ====="
          sudo rm -rf /usr/local/lib/node_modules

          echo "===== Remove CodeQL ====="
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          echo "===== Remove Rust ====="
          sudo rm -rf /opt/hostedtoolcache/Rust

          echo "===== Remove cached tools ====="
          sudo rm -rf /opt/hostedtoolcache

          echo "===== Remove Azure CLI cache ====="
          sudo rm -rf /opt/az

          echo "===== Remove large preinstalled directories ====="
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/local/go

          echo "===== Remove documentation ====="
          sudo rm -rf /usr/share/doc/*
          sudo rm -rf /usr/share/man/*
          sudo rm -rf /usr/share/info/*

          echo "===== Remove logs ====="
          sudo journalctl --vacuum-time=1s || true
          sudo rm -rf /var/log/*.gz
          sudo rm -rf /var/log/*.[0-9]

          echo "===== Remove temporary files ====="
          sudo rm -rf /tmp/*
          sudo rm -rf /var/tmp/*

          sync

      - name: Disk after cleanup
        run: |
          echo "===== AFTER ====="
          df -h /

          echo
          echo "===== TOP LEVEL ====="
          sudo du -xh / --max-depth=1 2>/dev/null | sort -h

          echo
          echo "===== WORKSPACE ====="
          df -h "$GITHUB_WORKSPACE"
