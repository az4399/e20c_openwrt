name: Build OpenWrt with DAE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man \
            intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp \
            nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools \
            python3-jsonschema qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd npm

      - name: Clone OpenWrt & Feeds
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          mkdir -p openwrt/package/dae
          cp -a package/dae/. openwrt/package/dae/
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Timezone
        run: |
          cd openwrt
          sed -i "s/set system.@system\['-1'\]\.timezone='UTC'/set system.@system['-1'].timezone='CST-8'/g" package/base-files/files/bin/config_generate
          sed -i "/set system.@system\['-1'\]\.timezone='CST-8'/a \t\tset system.@system['-1'].zonename='Asia/Shanghai'" package/base-files/files/bin/config_generate
          sed -i "s#0.openwrt.pool.ntp.org#ntp.aliyun.com#; s#1.openwrt.pool.ntp.org#ntp1.aliyun.com#; s#2.openwrt.pool.ntp.org#ntp2.aliyun.com#; s#3.openwrt.pool.ntp.org#time1.cloud.tencent.com#" package/base-files/files/bin/config_generate

      - name: Load Custom .config, Inject eBPF Options & Download Dependencies
        run: |
          cp .config openwrt/.config
          cd openwrt
          cat << 'EOF' >> .config
          CONFIG_PACKAGE_dae=y
          CONFIG_PACKAGE_dae-geoip=y
          CONFIG_PACKAGE_dae-geosite=y
          CONFIG_PACKAGE_luci-app-dae=y
          CONFIG_DEVEL=y
          CONFIG_KERNEL_DEBUG_INFO=y
          CONFIG_KERNEL_DEBUG_INFO_REDUCED=n
          CONFIG_KERNEL_DEBUG_INFO_BTF=y
          CONFIG_KERNEL_CGROUPS=y
          CONFIG_KERNEL_CGROUP_BPF=y
          CONFIG_KERNEL_BPF_EVENTS=y
          CONFIG_KERNEL_XDP_SOCKETS=y
          CONFIG_BPF_TOOLCHAIN_HOST=y
          CONFIG_PACKAGE_v2ray-geoip=y
          CONFIG_PACKAGE_v2ray-geosite=y
          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-xdp-sockets-diag=y
          EOF
          make defconfig
          make download -j$(nproc)

      - name: Compile OpenWrt Firmware
        run: |
          cd openwrt
          make -j$(nproc)

      - name: Organize Target Artifacts
        run: |
          mkdir -p output_firmware
          TARGET_DIR="openwrt/bin/targets/rockchip/armv8"
          cp "${TARGET_DIR}"/*.gz output_firmware/
          cp "${TARGET_DIR}"/sha256sums output_firmware/

      - name: Upload firmware to Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: dae-build-${{ github.run_number }}
          name: DAE OpenWrt Build ${{ github.run_number }}
          files: |
            output_firmware/*.gz
            output_firmware/sha256sums
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
